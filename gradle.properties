# Gradle must run on JDK 17 for this project:
# - Gradle 8.9 supports running on Java 8-22 only. A newer JVM (e.g. Java 25)
#   fails sync with "Incompatible Gradle JVM version" before any build runs.
# - AGP 8.7.3 requires JDK 17.
# In Android Studio: Settings -> Build Tools -> Gradle -> Gradle JDK -> jbr-17
# (the bundled JetBrains Runtime), then Sync. Do NOT hardcode
# org.gradle.java.home here -- the path is machine-specific.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
